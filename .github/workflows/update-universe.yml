name: Update universe (small-cap pool)

# Builds the universe of US small/micro/nano-cap stocks (mcap $5M~$1.3B,
# avg volume ≥ 50k) used by the unusual volume scanner.
# Triggered once per day by cron-job.org after US market close.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-universe
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Heartbeat
        run: |
          echo "── trigger: ${{ github.event_name }}"
          echo "── time:    $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build universe
        run: npm run fetch:universe

      # The guard lives in scripts/commit-data.sh now — see the comment there.
      # universe.json carries `generatedAt` and `elapsedSeconds`, which change
      # every run, so the old whole-file comparison never skipped anything.
      - name: Commit & push if the data changed
        run: |
          bash scripts/commit-data.sh \
            "chore(data): rebuild small-cap universe [skip ci]" \
            src/data/universe.json

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="❌ ${{ github.workflow }} failure"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --search "$title in:title state:open" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Another failure on $(date -u +'%Y-%m-%d %H:%M UTC') — see $run_url"
          else
            gh issue create \
              --title "$title" \
              --body "Workflow: ${{ github.workflow }}
          Run: $run_url
          First failure: $(date -u +'%Y-%m-%d %H:%M UTC')

          Close this issue when the workflow is healthy again — it will be reopened automatically on the next failure."
          fi
