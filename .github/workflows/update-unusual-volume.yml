name: Update unusual volume signals

# Scans the small-cap universe for stealth-accumulation signals
# (rate-projected daily volume ≥ 3x of 5-day average AND |price change| < 2%).
# Triggered every 30 minutes during US market hours by cron-job.org.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-unusual-volume
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Heartbeat
        run: |
          echo "── trigger: ${{ github.event_name }}"
          echo "── time:    $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scan unusual volume
        run: npm run fetch:unusual-volume
        continue-on-error: true

      # The guard lives in scripts/commit-data.sh now — see the comment there.
      #
      # This is the workflow the guard helps most. Outside market hours the
      # scan writes `marketStatus: "closed"` with an empty signal list every
      # single time, so the only thing that differed was `generatedAt` — and
      # each of those no-op commits cost a Vercel deployment.
      - name: Commit & push if the data changed
        run: |
          bash scripts/commit-data.sh \
            "chore(data): scan unusual volume [skip ci]" \
            src/data/unusual-volume.json src/data/signal-history.json

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="❌ ${{ github.workflow }} failure"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --search "$title in:title state:open" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Another failure on $(date -u +'%Y-%m-%d %H:%M UTC') — see $run_url"
          else
            gh issue create \
              --title "$title" \
              --body "Workflow: ${{ github.workflow }}
          Run: $run_url
          First failure: $(date -u +'%Y-%m-%d %H:%M UTC')

          Close this issue when the workflow is healthy again — it will be reopened automatically on the next failure."
          fi
