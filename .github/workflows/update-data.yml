name: Update market data

on:
  # Reduced 2026-08-25 from hourly (24 runs/day) to 4 runs on weekdays.
  #
  # Why: the Vercel Hobby plan allows 100 deployments per DAY across the
  # whole account, and every data commit here creates one. In the 24h
  # before this change the account had used ~75 of those, ~67 of them
  # from this repo alone, and deployments started failing with
  # `build-rate-limit` — including for a second project on the account.
  #
  # Two things were compounding it:
  #   1. cron-job.org also triggers this same workflow hourly through
  #      workflow_dispatch, so it was running TWICE an hour (~44 runs/day).
  #      Reducing this schedule only fixes the GitHub half — the external
  #      job needs to be turned down or off as well.
  #   2. Every run rewrites `fetchedAt` in the JSON, so the file always
  #      differs and the commit-if-changed guard never actually skips.
  #      Overnight and weekend runs committed pure noise.
  #
  # Times are UTC and cover the US session under both DST and standard
  # time: 14:07 around the open, 17:07 midday, 20:07 late, 21:07 after
  # the close. Minute :07 avoids the busy :00/:15/:30/:45 slots, which
  # GitHub deprioritises. Scheduled runs are best-effort and may drift
  # up to ~30 minutes.
  schedule:
    - cron: "7 14,17,20,21 * * 1-5"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Heartbeat
        run: |
          echo "── trigger: ${{ github.event_name }}"
          echo "── time:    $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "── ref:     ${{ github.ref }}"

      - name: Checkout
        uses: actions/checkout@v5

      # cron-job.org triggers this same workflow through workflow_dispatch on
      # its own schedule, on top of the `schedule:` above. That was running the
      # job twice an hour and committing twice an hour during market hours.
      #
      # Rather than depend on someone remembering to turn the external job
      # down, refuse to do the work twice within the same hour. `fetchedAt` in
      # sectors.json is the timestamp of the last run that actually changed
      # something, so a quiet market simply lets this fall through and the
      # commit guard handles it.
      - name: Skip if the data was refreshed in the last 50 minutes
        id: guard
        run: |
          last="$(jq -r '.fetchedAt // empty' src/data/sectors.json 2>/dev/null)"
          if [ -z "$last" ]; then
            echo "No previous timestamp — running."
            echo "skip=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          if [ "$age" -lt 3000 ]; then
            echo "Last refresh was $((age / 60)) minutes ago — skipping this run."
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "Last refresh was $((age / 60)) minutes ago — running."
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Fetch FX (Frankfurter)
        if: steps.guard.outputs.skip != 'true'
        run: npm run fetch:fx
        continue-on-error: true

      - name: Fetch sector ETFs (Yahoo Finance)
        if: steps.guard.outputs.skip != 'true'
        run: npm run fetch:sectors
        continue-on-error: true

      # The guard lives in scripts/commit-data.sh now. fx.json and sectors.json
      # both carry `fetchedAt`, rewritten on every run, so the old whole-file
      # comparison never skipped a commit — not once, in either direction.
      - name: Commit & push if the data changed
        if: steps.guard.outputs.skip != 'true'
        run: |
          bash scripts/commit-data.sh \
            "chore(data): auto-update FX + sectors [skip ci]" \
            src/data/

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="❌ ${{ github.workflow }} failure"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --search "$title in:title state:open" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Another failure on $(date -u +'%Y-%m-%d %H:%M UTC') — see $run_url"
          else
            gh issue create \
              --title "$title" \
              --body "Workflow: ${{ github.workflow }}
          Run: $run_url
          First failure: $(date -u +'%Y-%m-%d %H:%M UTC')

          Close this issue when the workflow is healthy again — it will be reopened automatically on the next failure."
          fi
