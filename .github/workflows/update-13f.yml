name: Update 13F holdings

# 13F filings are quarterly disclosures, so refreshing more than once a
# day is wasteful. Triggered once daily by cron-job.org during US
# off-hours so the SEC EDGAR servers are less loaded.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-13f
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Heartbeat
        run: |
          echo "── trigger: ${{ github.event_name }}"
          echo "── time:    $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch 13F (SEC EDGAR)
        env:
          SEC_CONTACT_EMAIL: "${{ github.repository_owner }}@users.noreply.github.com"
        run: npm run fetch:13f
        continue-on-error: true

      # The guard lives in scripts/commit-data.sh now. The old inline version
      # compared whole files, but `fetchedAt` is rewritten on every run, so it
      # never actually skipped — and every run cost a Vercel deployment.
      - name: Commit & push if the data changed
        run: |
          bash scripts/commit-data.sh \
            "chore(data): refresh 13F [skip ci]" \
            src/data/us-13f.json

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="❌ ${{ github.workflow }} failure"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --search "$title in:title state:open" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Another failure on $(date -u +'%Y-%m-%d %H:%M UTC') — see $run_url"
          else
            gh issue create \
              --title "$title" \
              --body "Workflow: ${{ github.workflow }}
          Run: $run_url
          First failure: $(date -u +'%Y-%m-%d %H:%M UTC')

          Close this issue when the workflow is healthy again — it will be reopened automatically on the next failure."
          fi
